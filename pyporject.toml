[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-saas-kit"
version = "0.1.0"
description = "Reusable Django applications for SaaS projects"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_saas_kit*"]

[tool.setuptools.package-data]
"django_saas_kit" = [
    "**/templates/**/*.html",
    "**/static/**/*",
]